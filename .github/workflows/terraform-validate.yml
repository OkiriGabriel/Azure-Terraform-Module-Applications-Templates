name: Terraform Validation and Security Scan

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

env:
  TERRAFORM_VERSION: '1.10.0'
  TFSEC_VERSION: 'latest'

jobs:
  terraform-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: ['example-infrastructure-dev', 'example-infrastructure-prod']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -backend=false
        continue-on-error: false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Comment PR - Format Check
        if: github.event_name == 'pull_request' && steps.fmt.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Terraform Format Check Failed**\n\nPlease run `terraform fmt -recursive` to format your code.'
            })

      - name: Comment PR - Validation Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Validation Results 
            
            **Workspace**: \`${{ matrix.workspace }}\`
            
            | Check | Status |
            |-------|--------|
            | 🎨 Format | \`${{ steps.fmt.outcome }}\` |
            | 🔧 Init | \`${{ steps.init.outcome }}\` |
            |  Validate | \`${{ steps.validate.outcome }}\` |
            
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  tfsec-scan:
    name: TFSec Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          version: ${{ env.TFSEC_VERSION }}
          format: sarif
          soft_fail: false
          github_token: ${{ secrets.GITHUB_TOKEN }}
          additional_args: --out tfsec-results.sarif

      - name: Upload SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tfsec-results.sarif
          category: tfsec

      - name: Run tfsec for PR comment
        if: github.event_name == 'pull_request'
        uses: aquasecurity/tfsec-pr-commenter-action@v1.3.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tfsec_version: ${{ env.TFSEC_VERSION }}

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: Check for sensitive files
        run: |
          echo "Checking for sensitive files..."
          
          # Check for common secret files
          SENSITIVE_FILES=(
            "*.pem"
            "*.key"
            "*.p12"
            "*.pfx"
            "*.pkcs12"
            "*.jks"
            "*.keystore"
            "*credential*"
            "*.secret"
            "*.secrets"
            "*secret.json"
            "*secrets.json"
            "*.env"
            ".env.*"
          )
          
          FOUND_FILES=()
          for pattern in "${SENSITIVE_FILES[@]}"; do
            files=$(find . -name "$pattern" -not -path "*/\.git/*" -not -path "*/\.terraform/*" || true)
            if [ ! -z "$files" ]; then
              FOUND_FILES+=("$files")
            fi
          done
          
          if [ ${#FOUND_FILES[@]} -gt 0 ]; then
            echo "⚠️ Warning: Found potentially sensitive files:"
            printf '%s\n' "${FOUND_FILES[@]}"
            echo "Please ensure these files are in .gitignore"
            exit 1
          else
            echo " No sensitive files found"
          fi

  checkov-scan:
    name: Checkov Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif
          soft_fail: true
          download_external_modules: false

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results.sarif
          category: checkov

  module-tests:
    name: Module Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - aks
          - security
          - vnet-peering
          - virtual-wan
          - routing
          - azure-migrate
          - database-migration
          - site-recovery
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init - ${{ matrix.module }}
        working-directory: ./modules/${{ matrix.module }}
        run: terraform init -backend=false

      - name: Terraform Validate - ${{ matrix.module }}
        working-directory: ./modules/${{ matrix.module }}
        run: terraform validate

      - name: Terraform Format Check - ${{ matrix.module }}
        working-directory: ./modules/${{ matrix.module }}
        run: terraform fmt -check -recursive

  documentation-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for README files
        run: |
          echo "Checking for required documentation..."
          
          REQUIRED_DOCS=(
            "README.md"
            "MODULES_README.md"
            "IMPLEMENTATION_SUMMARY.md"
            "CONTRIBUTING.md"
          )
          
          MISSING_DOCS=()
          for doc in "${REQUIRED_DOCS[@]}"; do
            if [ ! -f "$doc" ]; then
              MISSING_DOCS+=("$doc")
            fi
          done
          
          if [ ${#MISSING_DOCS[@]} -gt 0 ]; then
            echo "⚠️ Missing documentation files:"
            printf '%s\n' "${MISSING_DOCS[@]}"
            exit 1
          else
            echo " All required documentation files present"
          fi

      - name: Check module documentation
        run: |
          echo "Checking module documentation..."
          
          for module in modules/*/; do
            module_name=$(basename "$module")
            if [ ! -f "$module/README.md" ] && [ ! -f "$module/readme.md" ]; then
              echo "⚠️ Missing README in module: $module_name"
            else
              echo " README found in module: $module_name"
            fi
          done

  lint-check:
    name: Terraform Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Init TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --recursive --format compact

  summary:
    name: Tests Summary
    runs-on: ubuntu-latest
    needs: [terraform-validate, tfsec-scan, secret-scan, checkov-scan, module-tests, documentation-check, lint-check]
    if: always()
    
    steps:
      - name: Check all jobs status
        run: |
          echo "## 📊 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform Validate | ${{ needs.terraform-validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TFSec Scan | ${{ needs.tfsec-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scan | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Checkov Scan | ${{ needs.checkov-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Module Tests | ${{ needs.module-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Documentation Check | ${{ needs.documentation-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint Check | ${{ needs.lint-check.result }} |" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.terraform-validate.result }}" == "success" ]] && \
             [[ "${{ needs.tfsec-scan.result }}" == "success" ]] && \
             [[ "${{ needs.secret-scan.result }}" == "success" ]] && \
             [[ "${{ needs.module-tests.result }}" == "success" ]] && \
             [[ "${{ needs.documentation-check.result }}" == "success" ]] && \
             [[ "${{ needs.lint-check.result }}" == "success" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo " All checks passed!" >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ Some checks failed. Please review the logs." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
