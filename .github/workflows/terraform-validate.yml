name: Terraform Validation and Security Scan

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  TERRAFORM_VERSION: '1.10.0'
  TFSEC_VERSION: 'latest'

jobs:
  terraform-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        workspace: ['example-infrastructure-dev', 'example-infrastructure-prod']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -backend=false
        continue-on-error: false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Comment PR - Format Check
        if: github.event_name == 'pull_request' && steps.fmt.outcome == 'failure' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Terraform Format Check Failed**\n\nPlease run `terraform fmt -recursive` to format your code.'
            })

      - name: Comment PR - Validation Results
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Validation Results 
            
            **Workspace**: \`${{ matrix.workspace }}\`
            
            | Check | Status |
            |-------|--------|
            | 🎨 Format | \`${{ steps.fmt.outcome }}\` |
            | 🔧 Init | \`${{ steps.init.outcome }}\` |
            |  Validate | \`${{ steps.validate.outcome }}\` |
            
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Fail on formatting issues
        if: steps.fmt.outcome == 'failure'
        run: |
          echo "::error::Terraform files are not formatted. Run 'terraform fmt -recursive' locally."
          exit 1

  tfsec-scan:
    name: TFSec Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Results are printed to the job log only. Uploading SARIF to GitHub code scanning
      # (GitHub Advanced Security) is intentionally disabled.
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          version: ${{ env.TFSEC_VERSION }}
          soft_fail: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tfsec for PR comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: aquasecurity/tfsec-pr-commenter-action@v1.3.1
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tfsec_version: ${{ env.TFSEC_VERSION }}

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan (PR)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --debug --only-verified

      - name: TruffleHog Secret Scan (Push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --debug --only-verified

      - name: TruffleHog Secret Scan (Push - full repo)
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug --only-verified

      - name: Check for sensitive files
        run: |
          echo "Checking for sensitive files..."
          
          SENSITIVE_FILES=(
            "*.pem"
            "*.key"
            "*.p12"
            "*.pfx"
            "*.pkcs12"
            "*.jks"
            "*.keystore"
            "*.secret"
            "*.secrets"
            "*secret.json"
            "*secrets.json"
            ".env"
            ".env.*"
          )
          
          FOUND_FILES=()
          for pattern in "${SENSITIVE_FILES[@]}"; do
            while IFS= read -r file; do
              case "$file" in
                *.example|*/.env.example) continue ;;
                *) FOUND_FILES+=("$file") ;;
              esac
            done < <(find . -name "$pattern" \
              -not -path "*/.git/*" \
              -not -path "*/.terraform/*" \
              -not -name "*.example" \
              -not -name "env.example" 2>/dev/null || true)
          done
          
          # credential files (exclude examples)
          while IFS= read -r file; do
            FOUND_FILES+=("$file")
          done < <(find . -name "*credential*" \
            -not -path "*/.git/*" \
            -not -path "*/.terraform/*" \
            -not -name "*.example" 2>/dev/null || true)
          
          if [ ${#FOUND_FILES[@]} -gt 0 ]; then
            echo "⚠️ Warning: Found potentially sensitive files:"
            printf '%s\n' "${FOUND_FILES[@]}"
            echo "Please ensure these files are in .gitignore"
            exit 1
          else
            echo "No sensitive files found"
          fi

  checkov-scan:
    name: Checkov Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Results are printed to the job log only (no GitHub Advanced Security upload).
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          output_format: cli
          soft_fail: true
          download_external_modules: false

  discover-modules:
    name: Discover Modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.list.outputs.modules }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List modules
        id: list
        run: |
          MODULES=$(find modules -mindepth 2 -maxdepth 2 -name '*.tf' -exec dirname {} \; \
            | xargs -n1 basename | sort -u | jq -R . | jq -cs .)
          echo "Found modules: $MODULES"
          echo "modules=$MODULES" >> "$GITHUB_OUTPUT"

  module-tests:
    name: Module Tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: discover-modules
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-modules.outputs.modules) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        working-directory: ./modules/${{ matrix.module }}
        run: terraform fmt -check -recursive -diff

      - name: Terraform Init
        working-directory: ./modules/${{ matrix.module }}
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        working-directory: ./modules/${{ matrix.module }}
        run: terraform validate -no-color

      - name: Terraform Test (mocked providers)
        working-directory: ./modules/${{ matrix.module }}
        run: |
          if [ -d tests ] && ls tests/*.tftest.hcl >/dev/null 2>&1; then
            terraform test -no-color
          else
            echo "No tests for ${{ matrix.module }} - skipping"
          fi

  documentation-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for README files
        run: |
          echo "Checking for required documentation..."
          
          REQUIRED_DOCS=(
            "README.md"
            "MODULES_README.md"
            "IMPLEMENTATION_SUMMARY.md"
            "CONTRIBUTING.md"
          )
          
          MISSING_DOCS=()
          for doc in "${REQUIRED_DOCS[@]}"; do
            if [ ! -f "$doc" ]; then
              MISSING_DOCS+=("$doc")
            fi
          done
          
          if [ ${#MISSING_DOCS[@]} -gt 0 ]; then
            echo "⚠️ Missing documentation files:"
            printf '%s\n' "${MISSING_DOCS[@]}"
            exit 1
          else
            echo "All required documentation files present"
          fi

      - name: Check module documentation
        run: |
          echo "Checking module documentation..."
          MISSING=0
          
          for module in modules/*/; do
            module_name=$(basename "$module")
            if [ ! -f "$module/README.md" ] && [ ! -f "$module/readme.md" ]; then
              echo "::error::Missing README in module: $module_name"
              MISSING=1
            else
              echo "README found in module: $module_name"
            fi
          done
          exit $MISSING

  lint-check:
    name: Terraform Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Init TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --format compact

  summary:
    name: Tests Summary
    runs-on: ubuntu-latest
    needs: [terraform-validate, tfsec-scan, secret-scan, checkov-scan, module-tests, documentation-check, lint-check]
    if: always()
    
    steps:
      - name: Check all jobs status
        run: |
          echo "## 📊 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform Validate | ${{ needs.terraform-validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TFSec Scan | ${{ needs.tfsec-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scan | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Checkov Scan | ${{ needs.checkov-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Module Tests | ${{ needs.module-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Documentation Check | ${{ needs.documentation-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint Check | ${{ needs.lint-check.result }} |" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.terraform-validate.result }}" == "success" ]] && \
             [[ "${{ needs.tfsec-scan.result }}" == "success" ]] && \
             [[ "${{ needs.secret-scan.result }}" == "success" ]] && \
             [[ "${{ needs.module-tests.result }}" == "success" ]] && \
             [[ "${{ needs.documentation-check.result }}" == "success" ]] && \
             [[ "${{ needs.lint-check.result }}" == "success" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All checks passed!" >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ Some checks failed. Please review the logs." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
